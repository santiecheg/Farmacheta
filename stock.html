<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock · Mostrador de Farmacia</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="nav"></div>
<main>
<h1>Gestión de stock</h1>
<button id="btnBajo" onclick="toggleBajo()">Listado de productos con bajo stock</button><br><br>
<table><tr><th>Nombre</th><th>Presentación</th><th>Precio</th><th>Stock</th><th>Mínimo</th><th>Estado</th><th>Acciones</th></tr><tbody id="tablaMeds"></tbody></table>
<div class="card" style="margin-top:20px"><h3>Nuevo medicamento</h3><form id="formMed" class="fila">
<label>Nombre<input id="mNombre" required></label><label>Droga<input id="mDroga" required></label><label>Presentación<input id="mPres" required></label>
<label>Precio<input id="mPrecio" type="number" step="0.01" min="0" required></label><label>Stock<input id="mStock" type="number" min="0" required></label>
<label>Stock mínimo<input id="mMin" type="number" min="0" required></label><button type="submit">Agregar</button></form></div>
<h2>Ajuste de inventario</h2>
<div class="card"><form id="formAjuste" class="fila"><label>Medicamento<select id="aMed"></select></label>
<label>Tipo<select id="aTipo"><option value="ingreso">Ingreso</option><option value="egreso">Egreso</option><option value="ajuste">Ajuste (+/-)</option></select></label>
<label>Cantidad<input id="aCant" type="number" required></label><label>Motivo<input id="aMotivo" required></label><button type="submit">Registrar ajuste</button></form></div>
<table><tr><th>Fecha</th><th>Medicamento</th><th>Tipo</th><th>Cantidad</th><th>Motivo</th><th>Acciones</th></tr><tbody id="tablaAjustes"></tbody></table>
</main>
<script src="js/store.js"></script>
<script src="js/stock.js"></script>
</body>
</html>
